name: Web quality gates

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate Resonance guides and production
        run: |
          node scripts/validate-resonance-design.mjs
          node scripts/validate-resonance-boss-design.mjs
          node scripts/validate-resonance-guides.mjs
          node scripts/audit-resonance-production.mjs
          node scripts/sync-resonance-production.mjs
      - run: npm run quality

  campaign-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
